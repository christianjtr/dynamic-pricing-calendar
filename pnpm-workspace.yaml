packages:
  - apps/*
  - packages/*

overrides:
  h3: ^1.15.9
  esbuild: ^0.25.0
  vite: ^8.3.8

allowBuilds:
  "@biomejs/biome": true
  "@parcel/watcher": true
  "@scarf/scarf": false
  "@tree-sitter-grammars/tree-sitter-yaml": false
  core-js-pure: false
  esbuild: true
  tree-sitter: false
  tree-sitter-json: false
  vue-demi: true

minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.108.4"
  - "@tanstack/query-devtools@5.108.4"
  - "@tanstack/react-query@5.108.4"
